<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bharat Infrabuild</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        .delay-1 {
            animation-delay: 1s;
        }

        .animate {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 1s ease forwards;
        }

        .delay-2 {
            animation-delay: 1s;
        }


        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        body {
            background-image: url('../image.png');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            background-attachment: scroll;
        }

        section {
            min-height: 100vh;
            background: rgba(0, 0, 0, 0.5);
        }

        section div h2 {
            margin-top: 50px;
            font-size: 80px;
        }

        section div ul {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        section div ul li {
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <header class="bg-dark bg-opacity-75">
        <div class="container-fluid py-3 px-4">
            <h1 class="fw-bolder text-warning mb-0">Bharat Infrabuild.</h1>
            <p class="text-white fw-bold mb-0">
                Build the nation brick by brick.
            </p>
        </div>
    </header>

    <section class="min-vh-100 d-flex align-items-center">
        <div class="container text-white mt-5 ms-4">
            <h2 class="fw-bold display-3 display-md-1 text-wrap animate delay-1">Building More Than Structures</h2>
            <ul class="delay-2 animate">
                <li>Residential & Commercial Projects</li>
                <li>Infrastructure & Civil Construction</li>
                <li>Quality • Strength • Reliability</li>
            </ul>
        </div>
    </section>
    <footer class="bg-dark py-2">
        <h3 class="text-center text-white">- Website Launching Soon.</h3>
        <div class="mt-3">
            <p class="mt-2 text-center">
                <a href="https://wa.me/919861103147" class="btn btn-success text-white text-decoration-none">
                    <i class="bi bi-whatsapp"></i> Chat on WhatsApp
                </a>
            </p>
        </div>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
